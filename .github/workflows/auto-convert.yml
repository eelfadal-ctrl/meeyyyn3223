name: Auto Convert TXT to Clash YAML

on:
  push:
    paths:
      - 'dfgigfjh.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Clash YAML
        run: |
          python3 << 'EOF'
          import urllib.parse
          import re
          
          with open('dfgigfjh.txt', 'r', encoding='utf-8') as f:
              lines = [line.strip() for line in f if line.strip()]
          
          proxies = []
          for line in lines:
              if line.startswith('vless://'):
                  # vless://uuid@server:port?params#name
                  match = re.match(r'vless://([^@]+)@([^:]+):(\d+)\?(.+?)#(.+)', line)
                  if not match:
                      continue
                  uuid, server, port, params, name = match.groups()
                  params_dict = dict(urllib.parse.parse_qsl(params))
                  path = urllib.parse.unquote(params_dict.get('path', '/'))
                  host = params_dict.get('host', server)
                  sni = params_dict.get('sni', host)
                  
                  proxies.append(f'''  - name: "{name}"
    type: vless
    server: {server}
    port: {port}
    uuid: {uuid}
    network: ws
    tls: true
    skip-cert-verify: true
    servername: {sni}
    ws-opts:
      path: "{path}"
      headers:
        Host: {host}
''')
              
              elif line.startswith('trojan://'):
                  # trojan://password@server:port?params#name
                  match = re.match(r'trojan://([^@]+)@([^:]+):(\d+)\?(.+?)#(.+)', line)
                  if not match:
                      continue
                  password, server, port, params, name = match.groups()
                  params_dict = dict(urllib.parse.parse_qsl(params))
                  path = urllib.parse.unquote(params_dict.get('path', '/'))
                  host = params_dict.get('host', server)
                  sni = params_dict.get('sni', host)
                  
                  proxies.append(f'''  - name: "{name}"
    type: trojan
    server: {server}
    port: {port}
    password: {password}
    network: ws
    tls: true
    skip-cert-verify: true
    sni: {sni}
    ws-opts:
      path: "{path}"
      headers:
        Host: {host}
''')
          
          proxy_names = [re.search(r'name: "([^"]+)"', p).group(1) for p in proxies]
          
          output = "proxies:\n" + "".join(proxies)
          output += "\nproxy-groups:\n  - name: \"Proxy\"\n    type: select\n    proxies:\n"
          for n in proxy_names:
              output += f'      - "{n}"\n'
          output += "\nrules:\n  - MATCH,Proxy\n"
          
          with open('clash.yaml', 'w', encoding='utf-8') as f:
              f.write(output)
          
          print(f"Generated {len(proxies)} proxies")
          print(output[:500])
          EOF

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add clash.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update clash.yaml [skip ci]"
            git push --force origin main
          fi
