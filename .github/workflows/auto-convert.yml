name: Auto Convert TXT to Clash YAML

on:
  push:
    paths:
      - 'dfgigfjh.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Clash YAML via SUBAPI
        run: |
          curl -s -o clash.yaml "https://subapi.cmliussss.net/sub?target=clash&url=https://cdn.jsdelivr.net/gh/eelfadal-ctrl/meeyyyn3223@main/dfgigfjh.txt&insert=false&emoji=true&udp=true&list=false"
          echo "=== clash.yaml size ==="
          wc -c clash.yaml
          echo "=== First 20 lines ==="
          head -20 clash.yaml

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add clash.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update clash.yaml [skip ci]"
            git push --force origin main
          fi
