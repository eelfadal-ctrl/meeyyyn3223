name: Auto Convert TXT to Clash YAML

on:
  push:
    paths:
      - 'dfgigfjh.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download subconverter
        run: |
          wget -q https://github.com/tindy2013/subconverter/releases/download/v0.9.0/subconverter_linux64.tar.gz
          tar -xzf subconverter_linux64.tar.gz
          chmod +x subconverter/subconverter

      - name: Start subconverter
        run: |
          ./subconverter/subconverter &
          sleep 10

      - name: Generate Clash YAML
        run: |
          curl -s -o clash.yaml "http://127.0.0.1:25500/sub?target=clash&url=https://cdn.jsdelivr.net/gh/eelfadal-ctrl/meeyyyn3223@main/dfgigfjh.txt&insert=false&emoji=true&udp=true&list=false"
          echo "=== clash.yaml size ==="
          wc -c clash.yaml

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add clash.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update clash.yaml [skip ci]"
            git fetch origin main
            git reset --soft origin/main
            git add clash.yaml
            git commit -m "Auto-update clash.yaml [skip ci]" || echo "No changes"
            git push --force origin main
          fi
