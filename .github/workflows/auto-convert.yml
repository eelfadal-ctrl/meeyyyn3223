name: Auto Convert TXT to Clash YAML

on:
  push:
    paths:
      - 'dfgigfjh.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download subconverter
        run: |
          wget -q https://github.com/tindy2013/subconverter/releases/download/v0.9.0/subconverter_linux64.tar.gz
          tar -xzf subconverter_linux64.tar.gz
          chmod +x subconverter/subconverter

      - name: Start subconverter
        run: |
          ./subconverter/subconverter &
          sleep 8

      - name: Fetch TXT from CDN
        run: |
          curl -s -o source.txt "https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/dfgigfjh.txt"
          echo "=== Source file size ==="
          wc -c source.txt
          echo "=== Source file content ==="
          head -20 source.txt

      - name: Generate Clash YAML
        run: |
          curl -s -o clash.yaml "http://127.0.0.1:25500/sub?target=clash&url=https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/dfgigfjh.txt&insert=false&emoji=true&udp=true"
          echo "=== Generated clash.yaml size ==="
          wc -c clash.yaml
          echo "=== First 50 lines of clash.yaml ==="
          head -50 clash.yaml

      - name: Check if clash.yaml is valid
        run: |
          if grep -q "proxies:" clash.yaml && ! grep -q "No nodes were found" clash.yaml; then
            echo "✅ Clash YAML generated successfully"
          else
            echo "❌ ERROR: No nodes were found in clash.yaml"
            echo "This means the source TXT file has invalid or unsupported links"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add clash.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update clash.yaml [skip ci]"
            git push
          fi
